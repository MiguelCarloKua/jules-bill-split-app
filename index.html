<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bill Splitter</h1>

        <div class="input-group">
            <label for="total-bill">Total Bill (in Pesos)</label>
            <input type="number" id="total-bill" placeholder="e.g. 1500" min="0" step="any">
        </div>

        <div class="input-group">
            <label for="num-people">Number of People</label>
            <input type="number" id="num-people" placeholder="e.g. 3" min="1" value="1" step="1">
        </div>

        <div class="input-group">
            <label for="tip-percent">Tip Percent (Optional)</label>
            <input type="number" id="tip-percent" placeholder="e.g. 10" min="0" step="any">
        </div>

        <button id="calculate-btn">Calculate</button>

        <div class="result-section" id="result-section" style="display: none;">
            <div id="result-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
